paths:
  /auth/send:
    post:
      tags:
        - Auth
      summary: ارسال کد OTP
      description: ارسال کد یکبار مصرف به شماره موبایل برای ورود یا ثبت‌نام
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
              properties:
                phone:
                  type: string
                  pattern: '^(\+98|0)?9\d{9}$'
                  example: "09123456789"
                  description: شماره موبایل ایرانی
      responses:
        '200':
          description: کد OTP با موفقیت ارسال شد
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '403':
          description: شماره موبایل بن شده است
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: خطای اعتبارسنجی
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/verify:
    post:
      tags:
        - Auth
      summary: تایید کد OTP و ورود/ثبت‌نام
      description: تایید کد OTP و دریافت توکن‌های دسترسی. در صورت نبود کاربر، ثبت‌نام انجام می‌شود.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
                - code
              properties:
                phone:
                  type: string
                  pattern: '^(\+98|0)?9\d{9}$'
                  example: "09123456789"
                code:
                  type: string
                  pattern: '^[0-9]{5,6}$'
                  example: "12345"
                isSeller:
                  type: boolean
                  example: false
                  description: در صورت true، نقش SELLER به کاربر اضافه می‌شود
      responses:
        '200':
          description: ورود موفق
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: object
                    properties:
                      accessToken:
                        type: string
                      refreshToken:
                        type: string
        '201':
          description: ثبت‌نام و ورود موفق
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 201
                  message:
                    type: object
                    properties:
                      message:
                        type: string
                        example: "user is create"
                      accessToken:
                        type: string
                      refreshToken:
                        type: string
        '400':
          description: کد نامعتبر یا منقضی شده
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/me:
    get:
      tags:
        - Auth
      summary: دریافت اطلاعات کاربر فعلی
      description: دریافت اطلاعات کاربر لاگین شده
      security:
        - bearerAuth: []
      responses:
        '200':
          description: اطلاعات کاربر
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    $ref: '#/components/schemas/User'
        '401':
          description: توکن نامعتبر
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
