paths:
  /order:
    get:
      tags:
        - Order
      summary: دریافت لیست سفارش‌ها
      description: کاربران سفارش‌های خود و ادمین‌ها همه سفارش‌ها را می‌بینند
      security:
        - bearerAuth: []
      responses:
        '200':
          description: لیست سفارش‌ها
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                  message:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
        '401':
          description: توکن نامعتبر
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /order/{id}:
    patch:
      tags:
        - Order
      summary: به‌روزرسانی وضعیت سفارش (فقط ادمین)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [pending, paid, shipped, delivered, cancelled]
                  example: "shipped"
      responses:
        '200':
          description: وضعیت سفارش به‌روزرسانی شد
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: دسترسی غیرمجاز (فقط ادمین)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: سفارش یافت نشد
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
