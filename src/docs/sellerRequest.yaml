paths:
  /seller-request:
    post:
      tags:
        - SellerRequest
      summary: ارسال درخواست فروشنده شدن
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: "لطفاً درخواست من را بررسی کنید"
      responses:
        '201':
          description: درخواست ارسال شد
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: توکن نامعتبر
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags:
        - SellerRequest
      summary: دریافت درخواست‌های فروشنده
      security:
        - bearerAuth: []
      responses:
        '200':
          description: لیست درخواست‌ها
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                  message:
                    type: array
                    items:
                      $ref: '#/components/schemas/SellerRequest'

  /seller-request/{id}:
    delete:
      tags:
        - SellerRequest
      summary: حذف درخواست
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: درخواست حذف شد
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

    patch:
      tags:
        - SellerRequest
      summary: به‌روزرسانی وضعیت درخواست (فقط ادمین)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [pending, accepted, rejected]
                  example: "accepted"
      responses:
        '200':
          description: وضعیت به‌روزرسانی شد
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: دسترسی غیرمجاز
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
