paths:
  /user:
    get:
      tags:
        - User
      summary: دریافت لیست تمام کاربران (فقط ادمین)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: لیست کاربران
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                  message:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '401':
          description: دسترسی غیرمجاز
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /user/address:
    put:
      tags:
        - User
      summary: افزودن آدرس جدید
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - postalCode
                - address
                - cityId
              properties:
                name:
                  type: string
                  example: "منزل"
                postalCode:
                  type: string
                  example: "1234567890"
                address:
                  type: string
                  example: "تهران، خیابان ولیعصر، پلاک ۱۲"
                cityId:
                  type: integer
                  example: 1
      responses:
        '200':
          description: آدرس با موفقیت اضافه شد
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: توکن نامعتبر
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /user/address/{addressId}:
    delete:
      tags:
        - User
      summary: حذف آدرس
      security:
        - bearerAuth: []
      parameters:
        - name: addressId
          in: path
          required: true
          schema:
            type: string
          description: شناسه آدرس
      responses:
        '200':
          description: آدرس حذف شد
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: آدرس یافت نشد
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags:
        - User
      summary: ویرایش آدرس
      security:
        - bearerAuth: []
      parameters:
        - name: addressId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                postalCode:
                  type: string
                address:
                  type: string
                cityId:
                  type: integer
      responses:
        '200':
          description: آدرس ویرایش شد
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: آدرس یافت نشد
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
